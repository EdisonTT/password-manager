@if(label()) {
<label [class.mandatory]="isMandatory()" [for]="id()">{{ label() }}</label>
}
<div class="input-container" [class.margin-bottom]="!localErrorMessage()">
  <input
    [id]="id()"
    [type]="localType()"
    [placeholder]="placeholder()"
    autocomplete="off"
    [disabled]="disabled()"
    (input)="onChangeEvent($event)"
    (blur)="onClickEvent()"
    [value]="localValue()"
    [disabled]="disabled()"
    [class.error]="localErrorMessage()"
  />
  @if (showEyeIcon()) {
  <img
    (click)="togglePasswordVisibility()"
    [src]="passwordIconUrl()"
    alt="eye"
  />
  }
</div>
@if(localErrorMessage()) {
<span>{{ localErrorMessage()}}</span>
}
