<main>
  <h2>All Passwords</h2>
  <p>Where your secrets stay secret</p>

  <section class="search-box-container">
    <input-wrapper
      class="search-box"
      id="passwordSearch"
      placeholder="Search Passwords"
    />
    <button-wrapper buttonText="Add new Password" />
  </section>

  <section class="password-card-container">
    <password-card id="1" />
    <password-card id="2" />

    <button-wrapper
      buttonText="Load More"
      class="load-more-btn"
      (clicked)="buttonClick()"
    />

    <button-wrapper
      buttonText="Clear DB"
      class="load-more-btn"
      (clicked)="clearDB()"
    />
  </section>
</main>
