<article class="card" [attr.aria-expanded]="false">
  <header [class.expanded]="showContent()">
    <button
      [attr.aria-expanded]="false"
      [attr.aria-controls]="'card-content-'+id()"
      [id]="'card-toggle-'+id()"
      (click)="toggleContent()"
    >
      <div class="card-header">
        <img src="/icons/web.icon.svg" alt="web icon" />
        <h3>Card Title</h3>
      </div>
      <img
        src="/icons/expand.icon.svg"
        alt="expand icon"
        [class.rotate]="showContent()"
      />
    </button>
  </header>
  <div class="card-header-border" [class.expanded]="showContent()"></div>

  <section [id]="'card-content-'+id()" [class.expanded]="showContent()">
    <div class="card-content">
      <input-wrapper
        [metaData]="{
          id: 'userName'
        }"
        label="User Name:"
      />
      <button class="action-button">
        <img src="/icons/copy.icon.svg" alt="copy" />
      </button>
      <input-wrapper
        class="start-new-row"
        [metaData]="{
          id: 'password'
        }"
        label="Password:"
      />
      <button class="action-button">
        <img src="/icons/copy.icon.svg" alt="copy" />
      </button>
      <button class="action-button">
        <img src="/icons/eye.icon.svg" alt="copy" />
      </button>
      <input-wrapper
        [metaData]="{
          id: 'domain'
        }"
        label="Domain:"
      />
      <button class="action-button">
        <img src="/icons/copy.icon.svg" alt="copy" />
      </button>
      <div class="action-buttons start-new-row">
        <button-wrapper buttonText="Delete" buttonType="Secondary" />
        <button-wrapper buttonText="Edit" />
      </div>
    </div>
  </section>
</article>
