<article class="card" [attr.aria-expanded]="false">
  <header [class.expanded]="showContent()">
    <button
      [attr.aria-expanded]="false"
      [attr.aria-controls]="'card-content-'+id()"
      [id]="'card-toggle-'+id()"
      (click)="toggleContent()"
    >
      <div class="card-header">
        <img src="/icons/web.icon.svg" alt="web icon" />
        <h3>{{ cardData().title }}</h3>
      </div>
      <img
        src="/icons/expand.icon.svg"
        alt="expand icon"
        [class.rotate]="showContent()"
      />
    </button>
  </header>
  <div class="card-header-border" [class.expanded]="showContent()"></div>

  <section [id]="'card-content-'+id()" [class.expanded]="showContent()">
    <div class="card-content">
      <input-wrapper
        [id]="'userName' + id()"
        label="User Name:"
        [value]="userName()"
        [disabled]="true"
      />
      <button class="action-button" (click)="copyToClipBoard('username')">
        <img src="/icons/copy.icon.svg" alt="copy" />
      </button>
      <input-wrapper
        class="start-new-row"
        [id]="'password' + id()"
        [type]="passwordType()"
        label="Password:"
        [showDefaultPasswordIcon]="false"
        [value]="password()"
        [disabled]="true"
      />
      <button class="action-button" (click)="copyToClipBoard('password')">
        <img src="/icons/copy.icon.svg" alt="copy" />
      </button>
      <button class="action-button" (click)="togglePassword($event)">
        <img [src]="eyeIconPath()" alt="eye" />
      </button>
      <input-wrapper
        [id]="'domain' + id()"
        label="Domain:"
        [value]="domain() ?? ''"
        [disabled]="true"
      />
      <button class="action-button" (click)="copyToClipBoard('domain')">
        <img src="/icons/copy.icon.svg" alt="copy" />
      </button>
      <div class="action-buttons start-new-row">
        <button-wrapper
          buttonText="Delete"
          buttonType="Secondary"
          (btnClick)="deletePassword()"
        />
        <button-wrapper buttonText="Edit" (btnClick)="openEditModal()" />
      </div>
    </div>
  </section>
</article>

@if(editModalData()){
<manage-password [data]="editModalData()" (onClose)="onModalClose()" />
}
