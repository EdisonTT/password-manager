<modal-wrapper headerText="Manage Password" (closeModal)="closeModal(false)">
  <div class="content">
    <form [formGroup]="passwordForm">
      <input-wrapper
        id="manage-title"
        label="Title"
        placeholder="Title"
        type="url"
        [isMandatory]="true"
        formControlName="title"
      />
      <input-wrapper
        id="manage-username"
        label="Username"
        placeholder="Enter Username"
        [isMandatory]="true"
        formControlName="userName"
      />
      <input-wrapper
        id="manage-password"
        label="Password"
        placeholder="Enter Password"
        type="password"
        [isMandatory]="true"
        formControlName="password"
      />
      <input-wrapper
        id="manage-domain"
        label="Domain Name"
        placeholder="Domain"
        type="url"
        formControlName="domain"
      />
      <div class="tag-field-container">
        <select-wrapper
          id="manage-tag"
          label="Tag"
          [options]="tagsList()"
          formControlName="tags"
        />
        
        @if (!showAddTag()) {
          <div class="add-tag-trigger">
            <button-wrapper buttonText="+ Add new Tag" (btnClick)="toggleAddTag()" />
          </div>
        } @else {
          <div class="add-tag-inline">
            <input type="text" [formControl]="newTagControl" placeholder="Enter new tag..." />
            <button type="button" (click)="addNewTag()">Save</button>
            <button type="button" (click)="toggleAddTag()">Cancel</button>
            @if(duplicateTagError()) {
              <span class="error-msg">{{duplicateTagError()}}</span>
            }
          </div>
        }
      </div>
    </form>
    <button-wrapper
      buttonText="Save"
      class="save-btn"
      (btnClick)="onSubmit()"
    />
    <button-wrapper
      buttonText="Cancel"
      class="cancel-btn"
      (btnClick)="closeModal(false)"
    />
  </div>
</modal-wrapper>
