<modal-wrapper headerText="Manage Password" (closeModal)="closeModal(false)">
  <div class="content">
    <form [formGroup]="passwordForm">
      <input-wrapper
        id="manage-title"
        label="Title"
        placeholder="Title"
        type="url"
        [isMandatory]="true"
        formControlName="title"
      />
      <input-wrapper
        id="manage-username"
        label="Username"
        placeholder="Enter Username"
        [isMandatory]="true"
        formControlName="userName"
      />
      <input-wrapper
        id="manage-password"
        label="Password"
        placeholder="Enter Password"
        type="password"
        [isMandatory]="true"
        formControlName="password"
      />
      <input-wrapper
        id="manage-domain"
        label="Domain Name"
        placeholder="Domain"
        type="url"
        formControlName="domain"
      />
      <input-wrapper
        id="manage-tag"
        label="Tag"
        placeholder="Tag"
        formControlName="tags"
      />
    </form>
    <button-wrapper
      buttonText="Save"
      class="save-btn"
      (btnClick)="onSubmit()"
    />
    <button-wrapper
      buttonText="Cancel"
      class="cancel-btn"
      (btnClick)="closeModal(false)"
    />
  </div>
</modal-wrapper>
